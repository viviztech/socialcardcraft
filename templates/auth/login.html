{% extends "base.html" %}
{% block title %}Login — SocialCardCraft{% endblock %}
{% block full_content %}
<div class="min-h-screen flex items-center justify-center px-4" style="background:var(--bg-page)">
  <!-- Background glow (dark only) -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none" style="z-index:0">
    <div class="absolute top-1/4 left-1/2 -translate-x-1/2 w-[600px] h-[400px] rounded-full blur-3xl"
      style="background:rgba(99,102,241,0.08)"></div>
  </div>

  <div class="w-full max-w-md relative" style="z-index:1">
    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center gap-3 mb-4">
        <div class="w-12 h-12 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center shadow-xl">
          <span class="text-white text-xl font-bold">SC</span>
        </div>
        <span style="font-family:'Poppins',sans-serif;font-weight:700;font-size:1.5rem;color:var(--text-primary)">
          SocialCard<span style="color:#6366f1">Craft</span>
        </span>
      </div>
      <p class="text-sm" style="color:var(--text-secondary)">Sign in to create stunning social media cards</p>
    </div>

    <!-- Card -->
    <div class="auth-card card-glass p-8">
      {% if error %}
      <div class="p-3 mb-5 rounded-xl text-sm" style="background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);color:#f87171">
        {{ error }}
      </div>
      {% endif %}

      <form method="POST" action="/auth/login" class="space-y-5">
        <div>
          <label class="label">Email</label>
          <input type="email" name="email" required placeholder="you@example.com" class="input-field">
        </div>
        <div>
          <label class="label">Password</label>
          <input type="password" name="password" required placeholder="••••••••" class="input-field">
        </div>
        <button type="submit" class="w-full btn-primary py-3 text-base">Sign In →</button>
      </form>

      <p class="text-center text-sm mt-6" style="color:var(--text-muted)">
        Don't have an account?
        <a href="/auth/register" style="color:#6366f1;font-weight:500;margin-left:0.25rem">Create one</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
